<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>APK Builder</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#f5f5f7;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow:hidden}.app{height:100dvh;display:flex;flex-direction:column;background:#000}.top{height:88px;display:flex;align-items:center;justify-content:space-between;padding:18px 24px}.circle{width:58px;height:58px;border:1px solid #333;border-radius:50%;background:#202020;display:grid;place-items:center;color:#eee;cursor:pointer}.hamb{font-size:29px;line-height:1}.brand{font-size:21px;font-weight:750;letter-spacing:-.5px}.brand span{color:#5ea8ff}.plus{border:0;border-radius:32px;padding:14px 23px;background:#303944;color:#64b0ff;font-weight:750;font-size:17px;cursor:pointer}.spark{margin-right:7px}.main{flex:1;display:flex;align-items:center;justify-content:center;padding:30px 22px 120px;overflow:auto}.hero{width:min(760px,100%);text-align:center}.hero h1{font-size:clamp(30px,7vw,52px);margin:0 0 12px;letter-spacing:-1.8px}.hero p{margin:0 auto 34px;color:#929292;max-width:560px;font-size:16px;line-height:1.55}.suggestions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:18px}.chip{border:1px solid #292929;background:#0d0d0d;color:#aaa;border-radius:22px;padding:10px 14px;cursor:pointer}.composer{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);width:min(760px,calc(100% - 30px));background:#202020;border:1px solid #303030;border-radius:30px;min-height:62px;display:flex;align-items:center;padding:8px 10px 8px 15px;box-shadow:0 8px 40px #000;z-index:4}.attach{font-size:31px;color:#eee;width:42px;cursor:pointer}.prompt{flex:1;background:none;border:0;outline:0;color:#eee;font-size:17px;resize:none;height:42px;padding:9px 4px;font-family:inherit}.mic{border:0;background:none;color:#eee;font-size:25px;width:42px;cursor:pointer}.send{width:48px;height:48px;border-radius:50%;border:0;background:#3184ff;color:white;font-size:22px;cursor:pointer}.panel{position:fixed;inset:0;background:rgba(0,0,0,.82);backdrop-filter:blur(8px);display:none;align-items:flex-end;z-index:8}.sheet{width:100%;max-height:88dvh;background:#111;border-top:1px solid #333;border-radius:25px 25px 0 0;padding:22px;overflow:auto}.sheet h2{margin:0 0 20px}.field{margin:13px 0}.field label{display:block;color:#aaa;font-size:13px;margin-bottom:7px}.field input{width:100%;padding:14px 15px;border-radius:13px;border:1px solid #333;background:#1c1c1c;color:#fff;font-size:15px;outline:none}.actions{display:flex;gap:10px;margin-top:20px}.btn{flex:1;padding:14px;border-radius:13px;border:1px solid #333;background:#202020;color:#fff;font-weight:700;cursor:pointer}.primary{background:#3184ff;border-color:#3184ff}.drawer{position:fixed;top:0;bottom:0;left:0;width:min(330px,88vw);background:#111;border-right:1px solid #333;z-index:9;transform:translateX(-105%);transition:.25s;padding:22px}.drawer.open{transform:none}.drawer .item{padding:15px 8px;color:#bbb;border-radius:10px;cursor:pointer}.drawer .item:hover{background:#1d1d1d;color:#fff}.status{display:none;margin:20px auto;width:min(560px,100%);background:#111;border:1px solid #292929;border-radius:16px;padding:18px;text-align:left}.bar{height:7px;background:#292929;border-radius:9px;overflow:hidden;margin-top:13px}.bar i{display:block;height:100%;width:0;background:#3184ff;transition:width .4s}.log{font-family:ui-monospace,monospace;font-size:12px;color:#777;margin-top:13px;min-height:20px}.buildlink{display:none;margin-top:14px;color:#69adff}.ai{display:none;margin:20px auto;width:min(680px,100%);background:#111;border:1px solid #292929;border-radius:18px;padding:18px;text-align:left;white-space:pre-wrap;line-height:1.55;color:#ddd}.ai b{color:#69adff;display:block;margin-bottom:8px}.toast{position:fixed;top:92px;left:50%;transform:translateX(-50%);background:#1e1e1e;border:1px solid #333;padding:11px 15px;border-radius:14px;display:none;color:#ddd;z-index:12}@media(max-width:600px){.top{padding:14px 18px}.plus{padding:12px 16px}.brand{display:none}.hero p{font-size:14px}.suggestions{gap:7px}.chip{font-size:12px;padding:8px 11px}.composer{bottom:15px}}
</style></head>
<body>
<div class="app">
<header class="top"><button class="circle" id="menu"><span class="hamb">☰</span></button><div class="brand"><span>✦</span> APK Builder</div><button class="plus" id="plus"><span class="spark">✦</span>Get Plus</button></header>
<main class="main"><section class="hero"><h1>What do you want to build?</h1><p>Describe your Android app and Groq AI will turn your idea into a structured build plan for APK Builder.</p><div class="suggestions"><button class="chip" data-text="Build a modern shopping app">Shopping app</button><button class="chip" data-text="Build a social media app">Social app</button><button class="chip" data-text="Turn my website into an Android app">Website → APK</button><button class="chip" data-text="Create a simple business app">Business app</button></div><div class="ai" id="ai"><b>✦ Groq AI</b><span id="aiText"></span></div><div class="status" id="status"><b id="statusTitle">Preparing build…</b><div class="bar"><i id="bar"></i></div><div class="log" id="log"></div><a class="buildlink" id="actions" target="_blank" href="https://github.com/emzaro731-byte/apk/actions">Open GitHub Actions →</a></div></section></main>
<div class="composer"><label class="attach" title="Upload project">＋<input id="file" type="file" accept=".zip,.apk,.aab" hidden></label><textarea id="prompt" class="prompt" placeholder="Describe the Android app you want to build…"></textarea><button class="mic" id="mic">♩</button><button class="send" id="send">↑</button></div>
</div>
<div class="drawer" id="drawer"><h2>APK Builder</h2><div class="item" id="new">＋ New project</div><div class="item" id="projects">▣ Projects</div><div class="item" id="builds">⚙ Build history</div><div class="item" id="settings">⚙ AI Settings</div><div class="item" id="help">? Help</div></div>
<div class="panel" id="panel"><div class="sheet"><h2>AI & Build settings</h2><div class="field"><label>App name</label><input id="appName" value="My APK App"></div><div class="field"><label>Package name</label><input id="pkg" value="com.example.myapp"></div><div class="field"><label>Website URL (optional)</label><input id="url" placeholder="https://example.com"></div><div class="field"><label>Groq proxy URL</label><input id="endpoint" placeholder="https://your-worker.workers.dev"></div><div class="actions"><button class="btn" id="close">Cancel</button><button class="btn primary" id="save">Save AI settings</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s), drawer=$('#drawer'),panel=$('#panel'),toast=$('#toast');
const endpointKey='apkBuilderGroqEndpoint';
function showToast(t){toast.textContent=t;toast.style.display='block';setTimeout(()=>toast.style.display='none',2500)}
function endpoint(){return localStorage.getItem(endpointKey)||''}
$('#endpoint').value=endpoint();
$('#menu').onclick=()=>drawer.classList.toggle('open');
$('#plus').onclick=()=>showToast('Plus features can be connected to your account backend.');
$('#close').onclick=()=>panel.style.display='none';
$('#save').onclick=()=>{const v=$('#endpoint').value.trim();if(v)localStorage.setItem(endpointKey,v);else localStorage.removeItem(endpointKey);panel.style.display='none';showToast(v?'Groq AI endpoint saved':'AI endpoint cleared')};
$('#file').onchange=e=>{if(e.target.files[0]){$('#prompt').value='Build an Android app from '+e.target.files[0].name;showToast('Project selected: '+e.target.files[0].name)}};
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>$('#prompt').value=b.dataset.text);
$('#new').onclick=()=>{drawer.classList.remove('open');$('#prompt').value='';$('#ai').style.display='none';showToast('New project ready');};
$('#settings').onclick=()=>{drawer.classList.remove('open');$('#endpoint').value=endpoint();panel.style.display='flex'};
['projects','builds','help'].forEach(id=>$('#'+id).onclick=()=>{drawer.classList.remove('open');showToast(id==='projects'?'Projects are ready for backend storage.':id==='builds'?'Build history will appear here.':'Enter a prompt and send it to Groq AI.')});
$('#send').onclick=()=>askGroq();
async function askGroq(){const prompt=$('#prompt').value.trim();if(!prompt){showToast('Describe the app you want to build first.');return}const ep=endpoint();if(!ep){$('#endpoint').value='';panel.style.display='flex';showToast('Add your Groq proxy URL in AI Settings.');return}$('#ai').style.display='block';$('#aiText').textContent='Thinking…';try{const r=await fetch(ep,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'openai/gpt-oss-20b',messages:[{role:'system',content:'You are the AI architect inside APK Builder. Convert app ideas into concise, practical Android build plans. Include screens, core features, data needs, permissions, and a suggested package name. Do not claim an APK was compiled unless a build system actually did it.'},{role:'user',content:prompt}]})});const data=await r.json();if(!r.ok)throw new Error(data.error?.message||data.error||'Groq request failed');$('#aiText').textContent=data.choices?.[0]?.message?.content||'No response returned.'}catch(e){$('#aiText').textContent='Connection error: '+e.message;showToast('Could not reach Groq AI')}}
$('#mic').onclick=()=>{if('webkitSpeechRecognition' in window||'SpeechRecognition' in window){const R=window.SpeechRecognition||window.webkitSpeechRecognition,r=new R();r.lang='en-US';r.onresult=e=>$('#prompt').value=e.results[0][0].transcript;r.start()}else showToast('Voice input is not supported by this browser.')};
</script></body></html>

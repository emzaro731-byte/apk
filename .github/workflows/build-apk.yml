name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: App name
        required: true
        type: string
        default: My APK App
      package_name:
        description: Android package name
        required: true
        type: string
        default: com.example.myapp
      app_description:
        description: App description generated by AI
        required: false
        type: string
        default: Built with APK Builder
      website_url:
        description: Optional website URL to open inside the APK
        required: false
        type: string
        default: ''
      orientation:
        description: Screen orientation
        required: true
        type: choice
        options:
          - portrait
          - landscape
          - sensor
        default: portrait
      version_name:
        description: App version
        required: true
        type: string
        default: 1.0.0

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Generate Android project
        env:
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          APP_DESCRIPTION: ${{ inputs.app_description }}
          WEBSITE_URL: ${{ inputs.website_url }}
          ORIENTATION: ${{ inputs.orientation }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          mkdir -p builder/app/src/main/java builder/app/src/main/res/values
          cat > builder/settings.gradle <<'EOF'
pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement { repositoriesMode.set(org.gradle.api.initialization.resolve.RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
rootProject.name='APKBuilderGenerated'
include ':app'
EOF
          cat > builder/build.gradle <<'EOF'
plugins {
    id 'com.android.application' version '8.6.1' apply false
    id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
}
EOF
          cat > builder/gradle.properties <<'EOF'
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
EOF
          cat > builder/app/build.gradle <<'EOF'
plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
  namespace 'APP_PACKAGE'
  compileSdk 35
  defaultConfig {
    applicationId 'APP_PACKAGE'
    minSdk 24
    targetSdk 35
    versionCode 1
    versionName 'VERSION_NAME'
  }
}
dependencies {
  implementation 'androidx.core:core-ktx:1.15.0'
  implementation 'androidx.appcompat:appcompat:1.7.0'
}
EOF
          sed -i "s/APP_PACKAGE/${PACKAGE_NAME}/g; s/VERSION_NAME/${VERSION_NAME}/g" builder/app/build.gradle

          JAVA_DIR="builder/app/src/main/java/$(echo "$PACKAGE_NAME" | tr '.' '/')"
          mkdir -p "$JAVA_DIR"
          python3 - <<'PY'
          import os, pathlib
          p=os.environ['PACKAGE_NAME']
          d=pathlib.Path('builder/app/src/main/java')/p.replace('.','/')
          name=os.environ['APP_NAME'].replace('\\','\\\\').replace('"','\\"')
          desc=os.environ['APP_DESCRIPTION'].replace('\\','\\\\').replace('"','\\"').replace('\n',' ')
          url=os.environ.get('WEBSITE_URL','').strip().replace('\\','\\\\').replace('"','\\"')
          code=f'''package {p}

import android.annotation.SuppressLint
import android.graphics.Color
import android.os.Bundle
import android.view.Gravity
import android.webkit.WebChromeClient
import android.webkit.WebView
import android.webkit.WebViewClient
import android.widget.LinearLayout
import android.widget.TextView
import androidx.appcompat.app.AppCompatActivity

class MainActivity : AppCompatActivity() {{
  @SuppressLint("SetJavaScriptEnabled")
  override fun onCreate(savedInstanceState: Bundle?) {{
    super.onCreate(savedInstanceState)
    val url = "{url}"
    if (url.isNotBlank()) {{
      val web = WebView(this)
      web.settings.javaScriptEnabled = true
      web.settings.domStorageEnabled = true
      web.webViewClient = WebViewClient()
      web.webChromeClient = WebChromeClient()
      web.loadUrl(url)
      setContentView(web)
      return
    }}
    val root = LinearLayout(this)
    root.orientation = LinearLayout.VERTICAL
    root.gravity = Gravity.CENTER
    root.setPadding(48,48,48,48)
    root.setBackgroundColor(Color.BLACK)
    val title = TextView(this)
    title.text = "{name}"
    title.textColor = Color.WHITE
    title.textSize = 30f
    title.gravity = Gravity.CENTER
    val body = TextView(this)
    body.text = "{desc}"
    body.textColor = Color.LTGRAY
    body.textSize = 17f
    body.gravity = Gravity.CENTER
    body.setPadding(0,24,0,0)
    root.addView(title)
    root.addView(body)
    setContentView(root)
  }}
}}
'''
          (d/'MainActivity.kt').write_text(code)
          PY

          cat > builder/app/src/main/AndroidManifest.xml <<'EOF'
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
  <uses-permission android:name="android.permission.INTERNET" />
  <application android:theme="@style/AppTheme" android:label="APP_NAME" android:usesCleartextTraffic="true" android:allowBackup="false">
    <activity android:name=".MainActivity" android:screenOrientation="ORIENTATION" android:exported="true">
      <intent-filter>
        <action android:name="android.intent.action.MAIN" />
        <category android:name="android.intent.category.LAUNCHER" />
      </intent-filter>
    </activity>
  </application>
</manifest>
EOF
          sed -i "s|APP_NAME|${APP_NAME}|g; s|ORIENTATION|${ORIENTATION}|g" builder/app/src/main/AndroidManifest.xml
          cat > builder/app/src/main/res/values/styles.xml <<'EOF'
<resources>
  <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar">
    <item name="android:fontFamily">sans</item>
    <item name="android:windowLightStatusBar">false</item>
    <item name="android:statusBarColor">#000000</item>
    <item name="android:navigationBarColor">#000000</item>
  </style>
</resources>
EOF

      - name: Build debug APK
        working-directory: builder
        run: gradle assembleDebug --no-daemon

      - name: Build release APK
        working-directory: builder
        run: gradle assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-builder-debug-apk
          path: builder/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-builder-release-apk
          path: builder/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

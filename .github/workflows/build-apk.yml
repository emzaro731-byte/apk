name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: App name
        required: true
        default: My APK App
      package_name:
        description: Android package name
        required: true
        default: com.example.myapp
      website_url:
        description: Optional website URL to open inside the APK
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Generate Android project
        env:
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          WEBSITE_URL: ${{ inputs.website_url }}
        run: |
          set -e
          mkdir -p builder/app/src/main/java
          mkdir -p builder/app/src/main/res/values
          mkdir -p builder/app/src/main/res/mipmap-hdpi
          mkdir -p builder/app/src/main/res/mipmap-mdpi
          mkdir -p builder/app/src/main/res/mipmap-xhdpi
          mkdir -p builder/app/src/main/res/mipmap-xxhdpi
          mkdir -p builder/app/src/main/res/mipmap-xxxhdpi
          echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > builder/settings.gradle
          echo "dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }" >> builder/settings.gradle
          echo "rootProject.name='APKBuilderGenerated'" >> builder/settings.gradle
          echo "include ':app'" >> builder/settings.gradle
          cat > builder/build.gradle <<'EOF'
plugins {
    id 'com.android.application' version '8.6.1' apply false
    id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
}
EOF
          cat > builder/gradle.properties <<'EOF'
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
EOF
          cat > builder/app/build.gradle <<'EOF'
plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

android { namespace 'APP_PACKAGE'; compileSdk 35
  defaultConfig { applicationId 'APP_PACKAGE'; minSdk 24; targetSdk 35; versionCode 1; versionName '1.0' }
}

dependencies { implementation 'androidx.core:core-ktx:1.15.0'; implementation 'androidx.appcompat:appcompat:1.7.0' }
EOF
          sed -i "s/APP_PACKAGE/${PACKAGE_NAME}/g" builder/app/build.gradle
          mkdir -p "builder/app/src/main/java/$(echo "$PACKAGE_NAME" | tr '.' '/')"
          cat > "builder/app/src/main/java/$(echo "$PACKAGE_NAME" | tr '.' '/')/MainActivity.kt" <<'EOF'
package APP_PACKAGE

import android.annotation.SuppressLint
import android.os.Bundle
import android.webkit.WebChromeClient
import android.webkit.WebView
import android.webkit.WebViewClient
import androidx.appcompat.app.AppCompatActivity

class MainActivity : AppCompatActivity() {
    @SuppressLint("SetJavaScriptEnabled")
    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        val web = WebView(this)
        web.settings.javaScriptEnabled = true
        web.settings.domStorageEnabled = true
        web.webViewClient = WebViewClient()
        web.webChromeClient = WebChromeClient()
        val target = "APP_URL"
        if (target.isNotBlank()) web.loadUrl(target)
        else web.loadDataWithBaseURL(null, "<html><body style='background:#000;color:#fff;font-family:sans-serif;text-align:center;padding:60px'><h1>APP_NAME</h1><p>Your APK was built successfully.</p></body></html>", "text/html", "UTF-8", null)
        setContentView(web)
    }
}
EOF
          sed -i "s|APP_PACKAGE|${PACKAGE_NAME}|g; s|APP_URL|${WEBSITE_URL}|g; s|APP_NAME|${APP_NAME}|g" "builder/app/src/main/java/$(echo "$PACKAGE_NAME" | tr '.' '/')/MainActivity.kt"
          cat > builder/app/src/main/AndroidManifest.xml <<'EOF'
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <uses-permission android:name="android.permission.INTERNET" />
    <application android:theme="@style/AppTheme" android:label="APP_NAME" android:usesCleartextTraffic="true">
        <activity android:name=".MainActivity" android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
    </application>
</manifest>
EOF
          sed -i "s|APP_NAME|${APP_NAME}|g" builder/app/src/main/AndroidManifest.xml
          cat > builder/app/src/main/res/values/styles.xml <<'EOF'
<resources><style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar"><item name="android:fontFamily">sans</item><item name="android:colorAccent">#3184FF</item></style></resources>
EOF

      - name: Build debug APK
        working-directory: builder
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.app_name }}
          path: builder/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
